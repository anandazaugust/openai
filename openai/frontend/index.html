<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>💬 MyOwnGPT</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="layout">

    <div class="sidebar">
      <div class="sidebar-header">💬 MyOwnGPT</div>
      <button class="menu-btn" id="new-chat">➕ New Chat</button>
      <div id="chat-list" class="chat-list"></div>
      <button class="menu-btn danger" id="clear-all">🧹 Clear All Chats</button>
    </div>

    <div class="main">
      <div id="chat-box" class="chat-box"></div>

      <div class="input-container">
        <textarea id="prompt" rows="2" placeholder="Type your message..."></textarea>
        <button id="send">Send</button>
      </div>
    </div>

  </div>

<script>
  let chats = {};
  let activeChatId = null;

  const chatBox = document.getElementById("chat-box");
  const chatList = document.getElementById("chat-list");
  const input = document.getElementById("prompt");
  const sendBtn = document.getElementById("send");
  const newChatBtn = document.getElementById("new-chat");
  const clearAllBtn = document.getElementById("clear-all");


  /* ---------- Load chat list from Redis ---------- */
  async function loadRedisChatList() {
    const res = await fetch("/list_chats");
    const data = await res.json();

    const ids = data.chat_ids || [];

    chatList.innerHTML = "";

    if (ids.length === 0) {
      createNewChat();
      return;
    }

    ids.forEach(id => {
      chats[id] = chats[id] || { title: id };
    });

    renderChatList();
    loadChat(ids[0]);
  }


  /* ---------- Render sidebar ---------- */
  function renderChatList() {
    chatList.innerHTML = "";

    Object.keys(chats).forEach(id => {
      const btn = document.createElement("button");
      btn.className = "chat-item";
      btn.textContent = chats[id].title;
      btn.onclick = () => loadChat(id);
      chatList.appendChild(btn);
    });
  }


  /* ---------- Load chat messages from Redis ---------- */
  async function loadChat(id) {
    activeChatId = id;
    chatBox.innerHTML = "";

    const res = await fetch(`/history?chat_id=${id}`);
    const data = await res.json();

    const history = data.messages || [];

    history.forEach(msg => addMessage(msg.role, msg.content));
  }


  /* ---------- Create new chat ---------- */
  function createNewChat() {
    const id = "chat-" + Date.now();

    chats[id] = { title: id };
    renderChatList();
    chatBox.innerHTML = "";

    activeChatId = id;
  }


  /* ---------- Push message to UI ---------- */
  function addMessage(role, content) {
    const msg = document.createElement("div");
    msg.classList.add("message", role);
    msg.innerHTML = `<div class="bubble">${content}</div>`;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }


  /* ---------- Typing effect ---------- */
  async function typeMessage(role, text) {
    const msg = document.createElement("div");
    msg.classList.add("message", role);

    const bubble = document.createElement("div");
    bubble.classList.add("bubble");
    msg.appendChild(bubble);

    chatBox.appendChild(msg);

    for (let i = 0; i < text.length; i++) {
      bubble.textContent += text[i];
      chatBox.scrollTop = chatBox.scrollHeight;
      await new Promise(r => setTimeout(r, 5));
    }
  }


  /* ---------- Send message ---------- */
  sendBtn.addEventListener("click", async () => {
    const text = input.value.trim();
    if (!text) return;

    addMessage("user", text);
    input.value = "";

    addMessage("assistant", "Thinking...");

    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: activeChatId,
        message: text
      })
    });

    const data = await res.json();
    const bot = data.text;

    chatBox.lastChild.remove(); // remove "Thinking..."
    await typeMessage("assistant", bot);

    await loadChat(activeChatId);
  });


  /* ---------- Clear ALL chats (Redis + UI) ---------- */
  clearAllBtn.addEventListener("click", async () => {
    alert("Redis version of clear_all is not implemented yet. Ask me to create it.");
  });


  /* ---------- Start ---------- */
  loadRedisChatList();
</script>

</body>
</html>
