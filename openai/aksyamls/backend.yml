apiVersion: apps/v1
kind: Deployment
metadata:
  name: openaibackend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openaibackend
  template:
    metadata:
      labels:
        app: openaibackend
    spec:
      nodeSelector:
        agentpool: agentpool
      containers:
      - name: openaibackend
        image: acropenai2.azurecr.io/backend:latest

        # FIX: expose containerPort 8080
        # ports:
        #   - containerPort: 80

        env:
          - name: AZURE_OPENAI_ENDPOINT
            value: "https://openai1134.openai.azure.com"
          - name: AZURE_OPENAI_DEPLOYMENT
            value: "gpt-5-mini"
          - name: REDIS_HOST
            value: "redisforai.uksouth.redis.azure.net"
          - name: REDIS_PORT
            value: "10000"
          # - name: AZURE_CLIENT_ID
          #   value: "11dfd8f3-a3e4-43f2-b479-1e028d515eb7"


---
apiVersion: v1
kind: Service
metadata:
  name: openaibackend-svc
spec:
  type: LoadBalancer
  selector:
    app: openaibackend
  ports:
    - name: http
      port: 80
      targetPort: 8080
